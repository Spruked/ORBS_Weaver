# Illustrative authorization contract. Generate real nkeys; never commit seed material.
# This file documents the intended publish/subscribe authority split. Production
# deployments should render concrete nats-server permissions from these roles.

accounts: {
  LLM:       { users: [ { nkey: "U_LLM_PUBLIC" } ] }
  PLANNER:   { users: [ { nkey: "U_PLANNER_PUBLIC" } ] }
  TRIBUNAL:  { users: [ { nkey: "U_TRIBUNAL_PUBLIC" } ] }
  ADMISSION: { users: [ { nkey: "U_ADMISSION_PUBLIC" } ] }
  EXECUTOR:  { users: [ { nkey: "U_EXECUTOR_PUBLIC" } ] }
  BRIDGE:    { users: [ { nkey: "U_BRIDGE_PUBLIC" } ] }
  TOOL_WORKERS: { users: [ { nkey: "U_TOOLS_PUBLIC" } ] }
}

# Intended permissions:
# LLM:
#   pub ral.*.cycle.*.proposal
#   sub ral.*.ws.changed, ral.*.tel.health
#
# PLANNER:
#   pub ral.*.cycle.*.proposal, ral.*.cycle.*.admission.request
#   sub ral.*.cycle.*.verdict, ral.*.cycle.*.admission.result,
#       ral.*.cycle.*.permit, ral.*.tel.>, ral.*.ws.changed
#   DENY pub ral.*.cmd.>
#
# TRIBUNAL:
#   pub ral.*.cycle.*.verdict
#   sub ral.*.cycle.*.proposal
#   DENY pub ral.*.cmd.>
#
# ADMISSION:
#   pub ral.*.cycle.*.admission.result, ral.*.cycle.*.permit
#   sub ral.*.cycle.*.admission.request, ral.*.cycle.*.verdict, ral.*.ws.changed
#   DENY pub ral.*.cmd.>
#
# EXECUTOR:
#   pub ral.*.cmd.motion.>, ral.*.cmd.speech, ral.*.cmd.tool.*, ral.*.tel.execution
#   sub ral.*.cycle.*.permit, ral.*.ws.changed, ral.*.tel.>
#
# BRIDGE:
#   pub ral.*.tel.motion.>, ral.*.tel.nav, ral.*.tel.health,
#       ral.*.tel.perception.>, ral.*.ws.changed
#   sub ral.*.cmd.motion.>, ral.*.cmd.estop
#
# TOOL_WORKERS:
#   pub ral.*.tel.tool, ral.*.tel.execution
#   sub queue tool-workers on ral.*.cmd.tool.*
#
# LLM, PLANNER, and TRIBUNAL cannot publish cmd.*.
# EXECUTOR is the only ordinary command signer and must dispatch from a valid
# Execution Permit. cmd.estop uses a separately controlled safety publisher path.
